name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release"
        required: true

permissions:
  contents: read

env:
  RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  CONTROLLER_IMAGE: ghcr.io/${{ github.repository_owner }}/aks-flex-controller

jobs:
  build:
    name: Build and Release
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - os: linux
            arch: amd64
            goarch: amd64
          - os: linux
            arch: arm64
            goarch: arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ env.RELEASE_VERSION }}

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Validate version
        run: |
          set -euo pipefail
          if [[ ! "${RELEASE_VERSION}" =~ ^v[0-9A-Za-z._-]+$ ]]; then
            echo "Invalid release version: ${RELEASE_VERSION}" >&2
            exit 1
          fi

      - name: Build binary
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          GIT_COMMIT=$(git rev-parse --short HEAD)
          BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          LDFLAGS="-X github.com/Azure/AKSFlexNode/pkg/cmd/version.Version=${RELEASE_VERSION} -X github.com/Azure/AKSFlexNode/pkg/cmd/version.GitCommit=${GIT_COMMIT} -X github.com/Azure/AKSFlexNode/pkg/cmd/version.BuildTime=${BUILD_DATE} -w -s"

          BINARY_NAME="aks-flex-node-${GOOS}-${GOARCH}"

          go build -ldflags "${LDFLAGS}" -o "${BINARY_NAME}" ./cmd/aks-flex-node

          # Create tarball
          tar -czf "${BINARY_NAME}.tar.gz" "${BINARY_NAME}"
          echo "ASSET=${BINARY_NAME}.tar.gz" >> "$GITHUB_ENV"

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: binaries-${{ matrix.os }}-${{ matrix.arch }}
          path: ${{ env.ASSET }}

  controller-image:
    name: Build Controller Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ env.RELEASE_VERSION }}

      - name: Resolve release commit
        id: metadata
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Normalize controller image
        run: echo "CONTROLLER_IMAGE=${CONTROLLER_IMAGE,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          platforms: linux/amd64,linux/arm64

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Log in to ghcr.io
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push controller image
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile.aks-flex-controller
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ env.RELEASE_VERSION }}
            GIT_COMMIT=${{ steps.metadata.outputs.commit }}
          tags: ${{ env.CONTROLLER_IMAGE }}:${{ env.RELEASE_VERSION }}

      - name: Sign controller image
        run: cosign sign --yes "${CONTROLLER_IMAGE}@${{ steps.push.outputs.digest }}"

      - name: Generate controller image SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ env.CONTROLLER_IMAGE }}@${{ steps.push.outputs.digest }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          format: spdx-json
          artifact-name: sbom-aks-flex-controller.spdx.json
          output-file: sbom-aks-flex-controller.spdx.json

      - name: Attest controller image SBOM
        run: |
          cosign attest --yes \
            --predicate sbom-aks-flex-controller.spdx.json \
            --type spdxjson \
            "${CONTROLLER_IMAGE}@${{ steps.push.outputs.digest }}"

  release:
    name: Create Release
    needs: [build, controller-image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ env.RELEASE_VERSION }}

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Install kubectl
        uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5.1.0

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Install syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0

      - name: Validate version
        run: |
          set -euo pipefail
          if [[ ! "${RELEASE_VERSION}" =~ ^v[0-9A-Za-z._-]+$ ]]; then
            echo "Invalid release version: ${RELEASE_VERSION}" >&2
            exit 1
          fi

      - name: Normalize controller image
        run: echo "CONTROLLER_IMAGE=${CONTROLLER_IMAGE,,}" >> "$GITHUB_ENV"

      - name: Download artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: binaries-*
          path: ./artifacts

      - name: Consolidate artifacts
        run: |
          set -euo pipefail
          mkdir -p release-assets
          find artifacts -name "*.tar.gz" -exec cp {} release-assets/ \;
          install -m 0755 scripts/aks-flex-config release-assets/aks-flex-config

          manifest="release-assets/aks-flex-controller-${RELEASE_VERSION}.yaml"
          rm -f "${manifest}"
          for file in service-account.yaml configmap.yaml rbac.yaml service.yaml; do
            cat "hack/controller-deployment/${file}" >> "${manifest}"
            printf '\n---\n' >> "${manifest}"
          done
          kubectl set image --local \
            -f hack/controller-deployment/deployment.yaml \
            aks-flex-controller="${CONTROLLER_IMAGE}:${RELEASE_VERSION}" \
            -o yaml >> "${manifest}"

          test -s "${manifest}"
          grep -Fq "image: ${CONTROLLER_IMAGE}:${RELEASE_VERSION}" "${manifest}"
          grep -Fq -- '--enable-csr-approver=true' "${manifest}"
          if grep -Fq 'aks-flex-controller:latest' "${manifest}"; then
            echo "controller release manifest contains an unpinned image" >&2
            exit 1
          fi

          for archive in release-assets/*.tar.gz; do
            syft scan "${archive}" -o spdx-json="${archive}.spdx.json"
          done

          unbounded_version="$(go list -m -f '{{.Version}}' github.com/Azure/unbounded)"
          release_commit="$(git rev-parse HEAD)"
          scripts/aks-flex-config release-bom \
            --aks-flex-node-version "${RELEASE_VERSION}" \
            --git-commit "${release_commit}" \
            --controller-digest "${{ needs.controller-image.outputs.digest }}" \
            --controller-image "${CONTROLLER_IMAGE}" \
            --release-repository "${GITHUB_REPOSITORY}" \
            --unbounded-version "${unbounded_version}" \
            --output "release-assets/aks-flex-node-release-bom-${RELEASE_VERSION}.json"

          ls -lh release-assets/

      - name: Generate checksums
        run: |
          set -euo pipefail
          cd release-assets
          find . -maxdepth 1 -type f ! -name 'checksums.txt*' -printf '%f\0' \
            | sort -z \
            | xargs -0 sha256sum > checksums.txt
          cat checksums.txt

      - name: Sign release metadata
        run: |
          set -euo pipefail
          cd release-assets
          cosign sign-blob --yes --bundle=checksums.txt.bundle.json checksums.txt
          cosign sign-blob --yes \
            --bundle="aks-flex-controller-${RELEASE_VERSION}.yaml.bundle.json" \
            "aks-flex-controller-${RELEASE_VERSION}.yaml"
          cosign sign-blob --yes \
            --bundle="aks-flex-node-release-bom-${RELEASE_VERSION}.json.bundle.json" \
            "aks-flex-node-release-bom-${RELEASE_VERSION}.json"

      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cat > release-notes.md <<EOF
          ## AKS Flex Node ${RELEASE_VERSION}

          ### Installation

          **Quick install (Ubuntu 22.04/24.04):**
          \`\`\`bash
          curl -fsSL https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${RELEASE_VERSION}/scripts/install.sh | sudo env AKS_FLEX_NODE_REPOSITORY="${GITHUB_REPOSITORY}" bash
          \`\`\`

          **Manual installation:**
          1. Download the appropriate binary for your platform
          2. Extract the archive: \`tar -xzf aks-flex-node-*.tar.gz\`
          3. Move the binary to your PATH: \`sudo mv aks-flex-node-* /usr/local/bin/aks-flex-node\`
          4. Make it executable: \`sudo chmod +x /usr/local/bin/aks-flex-node\`

          ### Supported Platforms

          - **Ubuntu 22.04 LTS (AMD64)**: \`aks-flex-node-linux-amd64.tar.gz\`
          - **Ubuntu 22.04 LTS (ARM64)**: \`aks-flex-node-linux-arm64.tar.gz\`
          - **Ubuntu 24.04 LTS**: Compatible with AMD64 and ARM64 binaries above

          ### Verification

          Verify your download with the checksums in \`checksums.txt\`.

          ### What's Changed

          See the commits associated with the ${RELEASE_VERSION} tag.
          EOF

          release_flags=(--verify-tag --latest=false)
          if [[ "${RELEASE_VERSION}" =~ [.-](alpha|beta|rc)([.-]|$) ]]; then
            release_flags+=(--prerelease)
          fi

          gh release create "${RELEASE_VERSION}" \
            release-assets/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Release ${RELEASE_VERSION}" \
            --notes-file release-notes.md \
            "${release_flags[@]}"
